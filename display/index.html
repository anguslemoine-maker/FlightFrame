<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Overhead</title>
<style>
  :root{
    --bg:#07090d; --panel:#10141b; --line:#1d2430; --text:#eef2f7; --dim:#7d8898; --faint:#4a5566;
    --amber:#ffb238; --cyan:#4fd1ff; --green:#5be38a; --red:#ff6b6b;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:var(--bg);color:var(--text);overflow:hidden;
    font-family:"sans-serif-condensed","Roboto Condensed",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
  #root{position:absolute;left:0;top:0;width:100%;height:100%;display:flex;flex-direction:column;padding:34px 40px 30px}
  /* page drawn sideways for a frame whose firmware is stuck in portrait */
  .R #root{width:100vh;height:100vw;transform-origin:0 0;transform:rotate(-90deg) translateX(-100%)}
  .R2 #root{width:100vh;height:100vw;transform-origin:0 0;transform:rotate(90deg) translateY(-100%)}
  .R3 #root{transform:rotate(180deg)}
  .mono{font-family:"Roboto Mono","Droid Sans Mono",monospace}

  /* header */
  #hdr{display:flex;justify-content:space-between;align-items:flex-end;padding-bottom:20px;border-bottom:1px solid var(--line)}
  #hdr .place{font-size:20px;letter-spacing:5px;color:var(--dim);text-transform:uppercase}
  #hdr .place b{color:var(--amber);font-weight:700}
  #clock{font-size:44px;font-weight:300;letter-spacing:1px}
  #status{font-size:15px;color:var(--faint);margin-top:6px;letter-spacing:2px;text-transform:uppercase}

  /* hero */
  #hero{padding:26px 0 22px;border-bottom:1px solid var(--line);min-height:860px;position:relative}
  .airline{display:flex;align-items:center;min-height:64px}
  .logo{height:64px;background:#fff;border-radius:12px;padding:8px 14px;margin-right:20px;display:none}
  .logo img{height:48px;display:block}
  .aname{font-size:30px;color:var(--dim);letter-spacing:1px}
  .fno{font-size:96px;font-weight:700;line-height:1;margin-top:14px;letter-spacing:-2px}
  .fno small{font-size:24px;color:var(--faint);font-weight:400;letter-spacing:2px;margin-left:14px;vertical-align:middle}

  #plane{height:230px;margin:10px -20px 0;}
  #plane svg{width:100%;height:100%;display:block}
  #plane .liv{height:100%;display:flex;justify-content:flex-end;align-items:flex-end;overflow:visible;padding:0 24px 18px 0;box-sizing:border-box}
  #plane.hasliv{overflow:visible}
  #plane .livbox{position:relative}
  #plane .livbox .lv{width:100%;height:auto;display:block;filter:drop-shadow(0 8px 14px rgba(0,0,0,.45))}
  #plane .livbox .tl{position:absolute;transform:translate(-50%,-50%);object-fit:contain;border-radius:4px}
  .route{display:grid;grid-template-columns:1fr 90px 1fr;align-items:center;margin-top:4px}
  .apt .code{font-size:84px;font-weight:700;line-height:1;color:var(--amber)}
  .apt .city{font-size:24px;color:var(--dim);margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .apt.to{text-align:right}
  .arrow{text-align:center;color:var(--faint)}
  .arrow svg{width:60px;height:60px}
  .prog{height:6px;background:var(--line);border-radius:3px;margin-top:22px;position:relative}
  .prog i{position:absolute;left:0;top:0;bottom:0;background:var(--amber);border-radius:3px}
  .noroute{font-size:30px;color:var(--faint);margin-top:34px}
  .activity{margin-top:30px}
  .activity .act{font-size:44px;font-weight:600;line-height:1.15;color:var(--ink)}
  .activity .why{font-size:28px;color:var(--faint);margin-top:8px}
  #plane .photo{height:100%;display:flex;justify-content:center;align-items:center;padding:6px 20px}
  #plane .photo img{max-height:100%;max-width:100%;border-radius:14px;object-fit:cover;box-shadow:0 6px 24px rgba(0,0,0,.45)}
  .rnote2{font-size:16px;color:var(--faint);margin-top:8px;letter-spacing:1px}

  .stats{display:grid;grid-template-columns:1fr 1fr;grid-gap:16px;margin-top:24px}
  .stat{background:var(--panel);border-radius:14px;padding:18px 22px}
  .stat .k{font-size:16px;letter-spacing:3px;color:var(--faint);text-transform:uppercase}
  .stat .v{font-size:44px;font-weight:700;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .stat .s{font-size:20px;color:var(--dim);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .up{color:var(--green)} .down{color:var(--cyan)}

  /* idle */
  #idle{display:none;position:absolute;left:0;right:0;top:0;bottom:0;align-items:center;justify-content:center;flex-direction:column;text-align:center}
  #idle{justify-content:flex-start;align-items:stretch;text-align:left;padding-top:26px}
  .iclock{font-size:150px;font-weight:300;line-height:1;letter-spacing:-2px}
  .idate{font-size:30px;color:var(--dim);margin-top:6px}
  .wx{display:flex;align-items:center;margin-top:34px}
  .wxicon{width:120px;height:120px;margin-right:26px;flex:0 0 120px}
  .wxicon svg{width:100%;height:100%}
  .wxtemp{font-size:76px;font-weight:700;line-height:1}
  .wxdesc{font-size:24px;color:var(--dim);margin-top:6px}
  .ihead{font-size:15px;letter-spacing:3px;color:var(--faint);text-transform:uppercase;margin-bottom:8px}
  .rain{margin-top:34px}
  #rainChart svg{width:100%;height:88px;display:block}
  .rnote{position:absolute;font-size:16px;color:var(--dim)}
  .facts{display:grid;grid-template-columns:1fr 1.4fr;grid-gap:16px;margin-top:30px}
  .fact{background:var(--panel);border-radius:14px;padding:18px 22px}
  .fv{font-size:28px;font-weight:700}
  .fs{font-size:19px;color:var(--dim);margin-top:4px}
  .quiet{margin-bottom:18px;font-size:24px;letter-spacing:3px;color:var(--dim);text-transform:uppercase}

  /* radar */
  #radarWrap{position:relative;flex:1;display:flex;align-items:center;justify-content:center;padding:18px 0;min-height:0}
  #radar{height:100%;max-height:460px;width:auto}

  /* list */
  #list{border-top:1px solid var(--line);padding-top:14px}
  .row{display:grid;grid-template-columns:140px 1fr 112px 96px;align-items:center;padding:9px 0;font-size:22px;border-bottom:1px solid var(--line)}
  .row:last-child{border-bottom:0}
  .row .cs{font-weight:700}
  .row .rt{color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:10px}
  .row .al,.row .ds{text-align:right;color:var(--dim)}
  .row.sel .cs{color:var(--amber)}
  .lhead{font-size:15px;letter-spacing:3px;color:var(--faint);text-transform:uppercase;margin-bottom:4px}


  /* layout wrappers */
  #main{flex:1;display:flex;flex-direction:column;min-height:0}
  #side{flex:1;display:flex;flex-direction:column;min-height:0}

  /* ---------- landscape ---------- */
  .L #root{padding:24px 36px 22px}
  .L #hdr{padding-bottom:14px}
  .L #clock{font-size:38px}
  .L #main{flex-direction:row}
  .L #hero{flex:1;min-height:0;border-bottom:0;border-right:1px solid var(--line);padding:18px 36px 0 0}
  .L #side{flex:0 0 440px;padding-left:30px}
  .L #idle{padding-top:10px}
  .L .iclock{font-size:110px}
  .L .idate{font-size:24px}
  .L .wx{margin-top:18px}
  .L .wxicon{width:90px;height:90px;flex-basis:90px}
  .L .wxtemp{font-size:58px}
  .L .rain{margin-top:18px}
  .L #rainChart svg{height:64px}
  .L .facts{margin-top:16px}
  .L .quiet{margin-bottom:8px;font-size:20px}
  .L .airline{min-height:52px}
  .L .logo{height:52px;padding:6px 12px}
  .L .logo img{height:40px}
  .L .aname{font-size:26px}
  .L .fno{font-size:80px;margin-top:8px}
  .L #plane{height:250px;margin:0}
  .L .apt .code{font-size:64px}
  .L .apt .city{font-size:20px;margin-top:4px}
  .L .arrow svg{width:48px;height:48px}
  .L .prog{margin-top:14px}
  .L .noroute{margin-top:20px}
  .L .activity{margin-top:18px}
  .L .stats{grid-template-columns:1fr 1fr 1fr 1fr;grid-gap:12px;margin-top:18px}
  .L .stat{padding:12px 16px;border-radius:12px}
  .L .stat .k{font-size:13px;letter-spacing:2px}
  .L .stat .v{font-size:30px}
  .L .stat .s{font-size:16px}
  .L #radarWrap{padding:16px 0 10px}
  .L #radar{max-height:none;max-width:100%}
  .L .row{grid-template-columns:1fr 90px;font-size:19px;padding:8px 0}
  .L .row .cs{grid-row:1;grid-column:1}
  .L .row .ds{grid-row:1;grid-column:2}
  .L .row .al{display:none}
  .L .row .rt{grid-row:2;grid-column:1/3;font-size:17px;margin-top:2px}
  .L .lhead{font-size:13px}

  /* ---- boarding-pass ticket ---- */
  .ticket{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:26px 30px 24px;margin-top:6px;
          box-shadow:0 18px 40px -20px rgba(0,0,0,.55)}
  .ticket .route{margin-top:0}
  .ticket .arrow{display:none}
  .ticket .route{grid-template-columns:1fr 1fr}
  .arc{display:block;width:100%;height:64px;margin-top:6px}
  .perfrow{position:relative;margin:18px -30px 22px;height:28px}
  .perf{position:absolute;left:30px;right:30px;top:13px;border-top:2px dashed var(--line)}
  .notch{position:absolute;top:0;width:28px;height:28px;border-radius:50%;background:var(--bg);border:1px solid var(--line)}
  .notch.l{left:-15px;clip-path:inset(0 0 0 50%)} .notch.r{right:-15px;clip-path:inset(0 50% 0 0)}
  .ticket .stats{margin-top:0;grid-row-gap:22px}
  .ticket .stat{background:none;padding:0;border-radius:0}
  .ticket .stat .k{font-size:14px}
  .ticket .stat .v{font-size:40px}
  .barcode{height:38px;margin-top:24px;opacity:.55;border-radius:2px;
    background:repeating-linear-gradient(90deg,#7d8898 0 2px,transparent 2px 5px,#7d8898 5px 6px,transparent 6px 9px,#7d8898 9px 12px,transparent 12px 14px,#7d8898 14px 15px,transparent 15px 19px)}
  .ticket .rnote2{margin-top:2px}
  #plane{height:180px;margin-top:0}
  #hero{min-height:0}
  .ticket{padding:22px 28px 20px}
  .ticket .apt .code{font-size:76px}
  .arc{height:52px}
  .perfrow{margin:12px -28px 16px}
  .perf{left:28px;right:28px}
  .ticket .stats{grid-row-gap:16px}
  .ticket .stat .v{font-size:36px}
  .ticket .stat .s{font-size:18px}
  #radarWrap{min-height:250px}
  .L #plane{height:210px}
  .L .ticket .apt .code{font-size:56px}
  .L .ticket .stats{grid-template-columns:repeat(4,1fr)}
  .L .ticket .stat .v{font-size:26px}
  .L .ticket .stat .s{font-size:15px}
  .L .perfrow{margin:8px -28px 12px}

  #dim{position:fixed;left:0;top:0;right:0;bottom:0;background:#000;opacity:0;pointer-events:none}

  /* portrait: bigger map radar */
  #hero{padding:18px 0 14px}
  .fno{font-size:84px;margin-top:10px}
  #plane{height:140px}
  #radarWrap{padding:8px 0 6px;min-height:300px}
  #radar{max-height:none;max-width:100%}
  .row{padding:6px 0}
  .L #hero{padding:18px 36px 0 0}
  .L .fno{font-size:80px;margin-top:8px}
  .L #plane{height:210px}
  .L #radarWrap{padding:16px 0 10px}
  .L .row{padding:8px 0}

  .schline{font-size:19px;color:var(--dim);margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .schline .schtag{font-size:12px;letter-spacing:2px;color:#0b0f15;background:#7d8898;border-radius:4px;padding:2px 6px;margin-right:10px;vertical-align:2px;font-weight:700}
  .schline.late b{color:var(--amber)}
  .L .schline{font-size:16px}

  #chart{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;z-index:0}
  #radar{position:relative;z-index:1}
  /* ===== tracking a flight anywhere in the world ===== */
  #trk{position:absolute;left:0;top:0;right:0;bottom:0;background:var(--bg);z-index:20;display:none;flex-direction:column;padding:34px 40px 30px}
  #trk.on{display:flex}
  #trk .thdr{display:flex;justify-content:space-between;align-items:flex-end;padding-bottom:20px;border-bottom:1px solid var(--line)}
  #trk .tplace{font-size:20px;letter-spacing:5px;color:var(--dim);text-transform:uppercase} #trk .tplace b{color:var(--amber)}
  #trk .tst{font-size:15px;color:var(--faint);margin-top:6px;letter-spacing:2px;text-transform:uppercase;display:flex;align-items:center}
  #trk .tst i{width:10px;height:10px;border-radius:50%;background:var(--faint);display:inline-block;margin-right:10px;flex:none} #trk .tst i.live{background:var(--green);box-shadow:0 0 10px var(--green)} #trk .tst i.est{background:var(--amber)}
  #trk .tclock{font-size:44px;font-weight:300;letter-spacing:1px}
  #trk .tbody{flex:1;min-height:0;display:grid;grid-template-columns:100%;grid-template-rows:auto 1fr auto;grid-template-areas:"info" "map" "stats"}
  #trk .tinfo{grid-area:info} #trk .tmap{grid-area:map} #trk .tstats{grid-area:stats}
  #trk .tair{display:flex;align-items:center;margin-top:26px;min-height:64px}
  #trk .tlogo{height:64px;background:#fff;border-radius:12px;padding:8px 14px;margin-right:20px;display:none} #trk .tlogo img{height:48px;display:block}
  #trk .taname{font-size:30px;color:var(--dim);letter-spacing:1px}
  #trk .ttop{display:flex;justify-content:space-between;align-items:flex-end;margin-top:14px}
  #trk .tfno{font-size:96px;font-weight:700;line-height:1;letter-spacing:-2px;white-space:nowrap} #trk .tfno small{font-size:24px;color:var(--faint);font-weight:400;letter-spacing:2px;margin-left:14px}
  #trk .teta{text-align:right} #trk .teta .k{font-size:16px;letter-spacing:3px;color:var(--faint);text-transform:uppercase} #trk .teta .v{font-size:52px;font-weight:700;color:var(--amber);white-space:nowrap} #trk .teta .s{font-size:22px;color:var(--dim)}
  #trk .trt{display:flex;justify-content:space-between;margin-top:26px}
  #trk .trt .code{font-size:64px;font-weight:700;line-height:1} #trk .trt .city{font-size:24px;color:var(--dim);margin-top:4px} #trk .trt .r{text-align:right}
  #trk .tbar{height:10px;background:var(--line);border-radius:5px;margin:18px 0 10px;position:relative}
  #trk .tbar i{position:absolute;left:0;top:0;bottom:0;background:var(--amber);border-radius:5px} #trk .tbar b{position:absolute;top:50%;width:22px;height:22px;margin:-11px;border-radius:50%;background:var(--amber);box-shadow:0 0 0 6px rgba(255,178,56,.2)}
  #trk .tbl{display:flex;justify-content:space-between;font-size:20px;color:var(--dim)}
  #trk .tmap{margin:22px -40px 0;position:relative;border-top:1px solid var(--line);border-bottom:1px solid var(--line);overflow:hidden;min-height:0}
  #trk .tmap svg{position:absolute;left:0;top:0;width:100%;height:100%}
  #trk .tover{position:absolute;left:40px;bottom:26px;background:rgba(7,9,13,.82);border:1px solid var(--line);border-radius:14px;padding:12px 18px;display:none}
  #trk .tover .k{font-size:14px;letter-spacing:3px;color:var(--faint);text-transform:uppercase} #trk .tover .v{font-size:30px;font-weight:600;margin-top:2px} #trk .tover .s{font-size:20px;color:var(--dim)}
  #trk .tstats{display:grid;grid-template-columns:1fr 1fr 1fr;grid-gap:10px;margin-top:26px}
  #trk .tstats .k{font-size:15px;letter-spacing:3px;color:var(--faint);text-transform:uppercase} #trk .tstats .v{font-size:40px;font-weight:700;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis} #trk .tstats .s{font-size:20px;color:var(--dim);margin-top:2px}
  #trk .tfoot{display:flex;justify-content:space-between;align-items:center;font-size:19px;color:var(--faint);border-top:1px solid var(--line);padding-top:18px;margin-top:22px}
  #trk .tpill{border:1px solid var(--line);border-radius:30px;padding:8px 16px;color:var(--dim)} #trk .tpill b{color:var(--text)}
  #trk .tbig{font-size:46px;font-weight:700;margin-top:30px} #trk .tbig small{display:block;font-size:24px;color:var(--dim);font-weight:400;margin-top:8px}
  .L #trk{padding:24px 36px 22px}
  .L #trk .tbody{grid-template-columns:560px 1fr;grid-template-rows:auto 1fr;grid-template-areas:"info map" "stats map";column-gap:0}
  .L #trk .tmap{margin:0 -36px 0 30px;border:0;border-left:1px solid var(--line)}
  .L #trk .tfno{font-size:76px} .L #trk .ttop{display:block} .L #trk .teta{text-align:left;margin-top:18px} .L #trk .trt .code{font-size:54px}
  .L #trk .tstats{grid-template-columns:1fr 1fr;grid-row-gap:22px;align-content:start}
  .L #trk .tover{left:30px}
</style>
</head>
<body>
<div id="root">
  <div id="hdr">
    <div>
      <div class="place">Overhead · <b id="placeName"></b></div>
      <div id="status">Connecting…</div>
    </div>
    <div id="clock" class="mono">--:--</div>
  </div>

  <div id="main">
  <div id="hero">
    <div id="card" class="fade">
      <div class="airline"><div class="logo" id="logo"><img id="logoImg" alt=""></div><div class="aname" id="aname"></div></div>
      <div class="fno" id="fno"></div>
      <div id="plane"></div>
      <div class="ticket">
      <div id="routeBox"></div>
      <div class="perfrow"><span class="notch l"></span><div class="perf"></div><span class="notch r"></span></div>
      <div class="stats">
        <div class="stat"><div class="k">Altitude</div><div class="v" id="alt"></div><div class="s" id="alt2"></div></div>
        <div class="stat"><div class="k">Speed</div><div class="v" id="spd"></div><div class="s" id="spd2"></div></div>
        <div class="stat"><div class="k">From you</div><div class="v" id="dst"></div><div class="s" id="dst2"></div></div>
        <div class="stat"><div class="k">Aircraft</div><div class="v" id="typ"></div><div class="s" id="reg"></div></div>
      </div>
      </div>
    </div>
    <div id="idle">
      <div class="quiet" id="quiet"></div>
      <div class="iclock" id="iClock">--:--</div>
      <div class="idate" id="iDate"></div>
      <div class="wx" id="wx"><div class="wxicon" id="wxIcon"></div><div><div class="wxtemp" id="wxTemp">–</div><div class="wxdesc" id="wxDesc">Loading weather…</div></div></div>
      <div class="rain"><div class="ihead">Rain · next 24 hours</div><div id="rainChart"></div></div>
      <div class="facts">
        <div class="fact"><div class="ihead">Sun</div><div class="fv" id="sunTxt">–</div></div>
        <div class="fact"><div class="ihead">Space station</div><div class="fv" id="issTxt">Calculating…</div><div class="fs" id="issSub"></div></div>
      </div>
    </div>
  </div>

  <div id="side">
    <div id="radarWrap"><svg id="chart"></svg><svg id="radar" viewBox="-110 -110 220 220"></svg></div>
    <div id="list"><div class="lhead">Also nearby</div><div id="rows"></div></div>
  </div>
  </div>
  <div id="trk">
    <div class="thdr"><div><div class="tplace">Tracking · <b id="tCs"></b></div><div class="tst"><i id="tDot"></i><span id="tSt">Looking for the flight…</span></div></div><div class="tclock mono" id="tClock"></div></div>
    <div class="tbody">
      <div class="tinfo">
        <div class="tair"><div class="tlogo" id="tLogo"><img id="tLogoImg" alt=""></div><div class="taname" id="tAname"></div></div>
        <div class="ttop"><div class="tfno" id="tFno"></div><div class="teta" id="tEta"></div></div>
        <div class="trt" id="tRt"></div>
        <div id="tProg"></div>
      </div>
      <div class="tmap" id="tMap"><svg id="tSvg"><g id="tBase"></g><g id="tOver"></g></svg><div class="tover" id="tOverBox"><div class="k" id="tOk">Now over</div><div class="v" id="tOv"></div><div class="s" id="tOs"></div></div></div>
      <div class="tstats" id="tStats"></div>
    </div>
    <div class="tfoot"><span id="tFootL"></span><span class="tpill" id="tFootR"></span></div>
  </div>
  <script src="planes.js"></script>
  <script src="../planes/manifest.js" onerror="void 0"></script>
  <script src="settings.js"></script>
  <script src="schiphol.js"></script>
  <script src="radarmap.js"></script>
  <script src="satellite.min.js"></script>
</div>
  <div id="dim"></div>

<script>
(function(){
  // ---- layout follows the frame's tilt sensor ----
  // The frame's firmware keeps the screen in portrait, so the page rotates itself.
  // Gravity in device axes: +y = landscape (sensor upright), -y = landscape flipped, +x = portrait, -x = portrait flipped.
  var MODES={P:'', P2:'R3', L:'L R', L2:'L R2'};
  var mode=null, cand=null, candSince=0;

  var TZ=CFG.tz||undefined;
  function parts(d){ // local Amsterdam date parts
    try{ var f=new Intl.DateTimeFormat('en-GB',{timeZone:TZ,weekday:'long',day:'numeric',month:'long',hour:'2-digit',minute:'2-digit',hour12:false}).formatToParts(d), o={};
      f.forEach(function(p){o[p.type]=p.value}); return {wd:o.weekday,day:o.day,mon:o.month,h:(parseInt(o.hour,10)%24),m:o.minute} }
    catch(e){ return {wd:DAYS[d.getDay()],day:d.getDate(),mon:MONTHS[d.getMonth()],h:d.getHours(),m:pad(d.getMinutes())} }
  }
  function hm(d){ var p=parts(d); return clk(p.h,p.m) }
  function idleTick(){ var p=parts(new Date()); $('iClock').textContent=clk(p.h,p.m); $('iDate').textContent=p.wd+' '+p.day+' '+p.mon; }
  setInterval(idleTick,5000); idleTick();

  // --- weather icons (simple original drawings) ---
  function wxIcon(code,day){
    var sun='<circle cx="50" cy="50" r="17" fill="#ffb238"/><g stroke="#ffb238" stroke-width="5" stroke-linecap="round"><path d="M50 14v10M50 76v10M14 50h10M76 50h10M24.5 24.5l7 7M68.5 68.5l7 7M24.5 75.5l7-7M68.5 31.5l7-7"/></g>';
    var moon='<path d="M60 20a30 30 0 1 0 20 46A26 26 0 0 1 60 20z" fill="#c9d4e3"/>';
    var cloud=function(c,dy){return '<path transform="translate(0,'+(dy||0)+')" d="M30 72h44a16 16 0 0 0 0-32 22 22 0 0 0-41-6 18 18 0 0 0-3 38z" fill="'+c+'"/>'};
    var drops='<g stroke="#4fd1ff" stroke-width="5" stroke-linecap="round"><path d="M36 80l-4 10M52 80l-4 10M68 80l-4 10"/></g>';
    var snow='<g fill="#eef2f7"><circle cx="34" cy="86" r="4"/><circle cx="50" cy="90" r="4"/><circle cx="66" cy="86" r="4"/></g>';
    var bolt='<path d="M52 70l-10 16h10l-6 12 16-18H52l6-10z" fill="#ffb238"/>';
    var fog='<g stroke="#7d8898" stroke-width="5" stroke-linecap="round"><path d="M20 60h60M26 72h50M20 84h60"/></g>';
    var s='';
    if(code===0) s=day?sun:moon;
    else if(code<=2) s=(day?'<g transform="translate(-14,-14) scale(0.8)">'+sun+'</g>':'<g transform="translate(-12,-14) scale(0.8)">'+moon+'</g>')+cloud('#dfe5ec',6);
    else if(code===3) s=cloud('#aab4c0',-4);
    else if(code===45||code===48) s=cloud('#7d8898',-14)+fog;
    else if(code>=95) s=cloud('#7d8898',-12)+bolt;
    else if((code>=71&&code<=77)||code===85||code===86) s=cloud('#aab4c0',-12)+snow;
    else s=cloud('#aab4c0',-12)+drops;
    return '<svg viewBox="0 0 100 100">'+s+'</svg>';
  }
  function wxText(c){
    if(c===0) return 'Clear'; if(c===1) return 'Mostly clear'; if(c===2) return 'Partly cloudy'; if(c===3) return 'Overcast';
    if(c===45||c===48) return 'Fog'; if(c>=51&&c<=57) return 'Drizzle'; if(c>=61&&c<=65) return c===61?'Light rain':(c===63?'Rain':'Heavy rain');
    if(c===66||c===67) return 'Freezing rain'; if(c>=71&&c<=77) return 'Snow'; if(c>=80&&c<=82) return 'Showers'; if(c===85||c===86) return 'Snow showers';
    if(c>=95) return 'Thunderstorm'; return '';
  }
  var sunTimes=null;
  function loadWeather(){
    getJSON('https://api.open-meteo.com/v1/forecast?latitude='+HOME.lat+'&longitude='+HOME.lon+
      '&current=temperature_2m,apparent_temperature,weather_code,wind_speed_10m,wind_direction_10m,is_day'+
      '&hourly=precipitation,precipitation_probability&daily=sunrise,sunset&timezone=auto&forecast_days=2'+(U.d==='mi'?'&temperature_unit=fahrenheit&wind_speed_unit=mph&precipitation_unit=inch':''),10000).then(function(j){
      var c=j.current, off=(j.utc_offset_seconds||3600)*1000;
      function loc(x){ return new Date(Date.parse(x+':00Z')-off) }
      $('wxIcon').innerHTML=wxIcon(c.weather_code,c.is_day);
      $('wxTemp').textContent=Math.round(c.temperature_2m)+'°';
      $('wxDesc').textContent=wxText(c.weather_code)+' · feels '+Math.round(c.apparent_temperature)+'° · wind '+Math.round(c.wind_speed_10m)+(U.d==='mi'?' mph':' km/h')+' from the '+compass(c.wind_direction_10m);
      // rain chart: next 24 hours
      var now=Date.now(), t=j.hourly.time, pr=j.hourly.precipitation, pp=j.hourly.precipitation_probability, start=0;
      for(var i=0;i<t.length;i++){ if(loc(t[i]).getTime()+3600e3>now){ start=i; break } }
      var vals=pr.slice(start,start+24), probs=(pp||[]).slice(start,start+24), labels=t.slice(start,start+24), max=Math.max(1,Math.max.apply(null,vals)), total=0;
      vals.forEach(function(v){total+=v});
      var w=720,h=88,bw=w/24,svg='<svg viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none">', lab='';
      svg+='<line x1="0" y1="'+h+'" x2="'+w+'" y2="'+h+'" stroke="#1d2430" stroke-width="3"/>';
      vals.forEach(function(v,k){ var bh=v>0?Math.max(3,(h-8)*v/max):0;
        if(bh) svg+='<rect x="'+(k*bw+3)+'" y="'+(h-bh)+'" width="'+(bw-6)+'" height="'+bh+'" rx="3" fill="#4fd1ff" opacity="'+(0.45+0.55*((probs[k]||60)/100))+'"/>';
        if(k%6===0) lab+='<span style="position:absolute;left:'+(k/24*100)+'%;top:4px">'+labels[k].slice(11,16)+'</span>'; });
      svg+='</svg>';
      var note = total<(U.d==='mi'?0.004:0.1) ? '<div class="rnote" style="top:30px;left:0;right:0;text-align:center;font-size:22px">No rain expected</div>'
                           : '<div class="rnote" style="top:0;right:0">'+(Math.round(total*10)/10)+(U.d==='mi'?' in':' mm')+' total</div>';
      $('rainChart').innerHTML='<div style="position:relative">'+note+svg+'<div style="position:relative;height:26px;font-size:15px;color:#4a5566">'+lab+'</div></div>';
      // sunrise / sunset
      sunTimes={rise:j.daily.sunrise.map(loc), set:j.daily.sunset.map(loc)};
      renderSun();
    }).catch(function(){ setTimeout(loadWeather,60000) });
  }
  function renderSun(){
    if(!sunTimes) return; var now=new Date(), r=sunTimes.rise, st=sunTimes.set;
    if(now<r[0]) $('sunTxt').innerHTML='↑ '+hm(r[0])+' <span style="color:var(--faint)">·</span> ↓ '+hm(st[0]);
    else if(now<st[0]) $('sunTxt').innerHTML='Sets '+hm(st[0]);
    else $('sunTxt').innerHTML='Rises '+hm(r[1]);
  }
  loadWeather(); setInterval(loadWeather,15*60e3); setInterval(renderSun,60e3);

  // --- ISS passes (satellite.js + Celestrak orbit data) ---
  function sunEci(date){ // approximate sun direction (unit vector, ECI) and elevation helper
    var jd=date.getTime()/86400000+2440587.5, n=jd-2451545.0, L=(280.46+0.9856474*n)%360, g=rad((357.528+0.9856003*n)%360);
    var lam=rad(L+1.915*Math.sin(g)+0.02*Math.sin(2*g)), eps=rad(23.439-0.0000004*n);
    return {x:Math.cos(lam), y:Math.cos(eps)*Math.sin(lam), z:Math.sin(eps)*Math.sin(lam)};
  }
  function sunElev(date){
    var s=sunEci(date), gmst=satellite.gstime(date), obs={longitude:rad(HOME.lon),latitude:rad(HOME.lat),height:0};
    var look=satellite.ecfToLookAngles(obs, satellite.eciToEcf({x:s.x*1.496e8,y:s.y*1.496e8,z:s.z*1.496e8},gmst));
    return look.elevation*180/Math.PI;
  }
  function sunlit(pos,date){ // is the satellite outside Earth's (cylindrical) shadow?
    var s=sunEci(date), dot=pos.x*s.x+pos.y*s.y+pos.z*s.z;
    if(dot>0) return true;
    var px=pos.x-dot*s.x, py=pos.y-dot*s.y, pz=pos.z-dot*s.z;
    return Math.sqrt(px*px+py*py+pz*pz)>6371;
  }
  var issPasses=null;
  function computePasses(tle){
    if(!window.satellite) return;
    var rec=satellite.twoline2satrec(tle[0],tle[1]), obs={longitude:rad(HOME.lon),latitude:rad(HOME.lat),height:0};
    var t=Date.now(), end=t+3*86400e3, step=30e3, pass=null, out=[];
    for(;t<end;t+=step){
      var d=new Date(t), pv=satellite.propagate(rec,d); if(!pv.position) continue;
      var look=satellite.ecfToLookAngles(obs, satellite.eciToEcf(pv.position, satellite.gstime(d))), el=look.elevation*180/Math.PI;
      if(el>10){
        var az=look.azimuth*180/Math.PI;
        if(!pass) pass={start:d,startAz:az,max:el,maxAt:d,vis:false,day:sunElev(d)>-6};
        if(el>pass.max){ pass.max=el; pass.maxAt=d }
        pass.end=d; pass.endAz=az;
        if(!pass.vis && sunlit(pv.position,d) && sunElev(d)<-6) pass.vis=true;
      } else if(pass){ out.push(pass); pass=null; }
    }
    issPasses=out; renderISS();
  }
  function renderISS(){
    if(!issPasses) return;
    var now=new Date(), vis=null, any=null;
    for(var i=0;i<issPasses.length;i++){ var p=issPasses[i]; if(p.end<now) continue; if(!any) any=p; if(p.vis){ vis=p; break } }
    function when(d){ var p=parts(d), today=parts(now).day===p.day; return (today?'Today':p.wd)+' '+clk(p.h,p.m) }
    if(vis){
      $('issTxt').textContent='Visible '+when(vis.start);
      $('issSub').textContent='Up to '+Math.round(vis.max)+'° high · '+compass(vis.startAz)+' → '+compass(vis.endAz)+' · '+Math.max(1,Math.round((vis.end-vis.start)/60000))+' min';
    } else if(any){
      $('issTxt').textContent='Overhead '+when(any.start);
      $('issSub').textContent=(any.day?'Too light to see':'In Earth\'s shadow, not visible')+' · no visible pass in the next 3 days';
    } else { $('issTxt').textContent='No passes soon'; $('issSub').textContent=''; }
  }
  function loadTLE(){
    var c=null; try{ c=JSON.parse(localStorage.getItem('ff_tle')||'null') }catch(e){}
    if(c && Date.now()-c.t<12*3600e3){ computePasses(c.l); return }
    fetch('https://celestrak.org/NORAD/elements/gp.php?CATNR=25544&FORMAT=TLE').then(function(x){return x.text()}).then(function(txt){
      var l=txt.trim().split(/\r?\n/).map(function(x){return x.trim()}).filter(function(x){return /^[12] /.test(x)});
      if(l.length<2) throw 0;
      try{ localStorage.setItem('ff_tle',JSON.stringify({t:Date.now(),l:l})) }catch(e){}
      computePasses(l);
    }).catch(function(){ if(c) computePasses(c.l); else setTimeout(loadTLE,10*60e3) });
  }
  setTimeout(loadTLE,3000); setInterval(loadTLE,3600e3); setInterval(renderISS,60e3);

  // ---- logos & colours for airlines not in the built-in table ----
  var ICAO_LOGO='https://raw.githubusercontent.com/Jxck-S/airline-logos/main/flightaware_logos/';
  var auto={};   // icao -> {st, logo:true/false, color}
  try{ auto=JSON.parse(localStorage.getItem('ff_auto')||'{}') }catch(e){ auto={} }
  function autoInfo(icao){
    if(!icao) return null;
    var r=auto[icao];
    if(r && r.st!=='p') return r;
    if(r) return null;
    auto[icao]={st:'p'};
    fetch(ICAO_LOGO+icao+'.png').then(function(x){ if(!x.ok) throw 0; return x.blob() }).then(function(b){
      var u=URL.createObjectURL(b), im=new Image();
      im.onload=function(){
        var col=null;
        try{ col=dominant(im) }catch(e){}
        auto[icao]={st:'ok',logo:true,color:col};
        try{ localStorage.setItem('ff_auto',JSON.stringify(auto)) }catch(e){}
        planeKey=''; render();
      };
      im.onerror=function(){ auto[icao]={st:'ok',logo:false} };
      im.src=u;
    }).catch(function(){ auto[icao]={st:'ok',logo:false}; try{ localStorage.setItem('ff_auto',JSON.stringify(auto)) }catch(e){} });
    return null;
  }
  function dominant(im){
    var c=document.createElement('canvas'), w=c.width=Math.min(64,im.width), h=c.height=Math.min(64,im.height), g=c.getContext('2d');
    g.drawImage(im,0,0,w,h);
    var d=g.getImageData(0,0,w,h).data, bins={}, best=null, dark=null;
    for(var i=0;i<d.length;i+=4){
      if(d[i+3]<128) continue;
      var R=d[i],G=d[i+1],B=d[i+2],mx=Math.max(R,G,B),mn=Math.min(R,G,B);
      if(mn>225) continue;                       // skip white
      if(mx-mn<35){ if(!dark||mx<dark[0]) dark=[mx,R,G,B]; continue }  // greys
      var k=(R>>5)+'_'+(G>>5)+'_'+(B>>5), e=bins[k]||(bins[k]={n:0,r:0,g:0,b:0});
      e.n++; e.r+=R; e.g+=G; e.b+=B;
      if(!best||e.n>best.n) best=e;
    }
    function hex(r,g,b){return '#'+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1)}
    if(best) return hex(Math.round(best.r/best.n),Math.round(best.g/best.n),Math.round(best.b/best.n));
    if(dark) return hex(dark[1],dark[2],dark[3]);
    return null;
  }

  // ---- what kind of flight is it? (for non-airline traffic) ----
  var MIL_CS=/^(NAF|NCG|RRR|RFR|GAF|GAM|BAF|FAF|CTM|IAM|SPAR|RCH|NATO|NAVY|ASY|HKY|DUKE|PLF|SUI|HUAF|CEF|DNY|NOW|SVF|FNF|LAGR|BRK|KIWI|ASCOT|TARTN|MMF|RSF|SHF)/;
  function category(a,r,ac){
    var c=cs(a), own=((ac&&ac.registered_owner)||'')+' '+((r&&r.airline&&r.airline.name)||'');
    if(/coast ?guard|kustwacht|garde c[oô]ti|k[uü]stenwache/i.test(own) || /^NCG/.test(c)) return 'coastguard';
    if(/police|politie|polizei|gendarm/i.test(own) || /^(POLITIE|POL|PHPX)/.test(c)) return 'police';
    if(/ambulan|lifeliner|trauma|medical|air rescue|hems|rettung|ANWB|DRF|ADAC/i.test(own) || /^(LIFE|MMD|RESQ|AMB|CHX)/.test(c)) return 'medical';
    if(/navy|naval|marine|koninklijke marine|marineflieger/i.test(own)) return 'navy';
    if(/\barmy\b|landmacht|heer\b/i.test(own)) return 'army';
    if(/air force|luchtmacht|luftwaffe|force a[eé]rienne|\braf\b/i.test(own) || /^NAF/.test(c)) return 'airforce';
    if(/defen[cs]e|defensie|military|ministry of defence|NATO|bundeswehr/i.test(own) || (a.dbFlags&1) || MIL_CS.test(c)) return 'military';
    var airline = r&&r.airline&&r.airline.icao;
    var regLike = !c || (a.r && c.replace(/-/g,'')===a.r.replace(/-/g,'')) || !/^[A-Z]{3}\d/.test(c);
    if(!airline && regLike) return 'private';
    return '';
  }

  // ---- private / non-airline flights: proper type names, what kind of flight, and what it is doing ----
  function typeName(a,ac){
    if(TYPES[a.t]) return TYPES[a.t];
    var d=a.desc||'';
    if(d){
      d=d.replace(/(-\d+)?(\/[\w-]+)+$/,'').replace(/\b([A-Z]{4,})\b/g,function(w){ return w[0]+w.slice(1).toLowerCase() });
      return d.replace(/\bTl Ultralight\b/,'TL-Ultralight');
    }
    if(ac&&ac.type) return ((ac.manufacturer&&ac.type.toUpperCase().indexOf(ac.manufacturer.split(' ')[0].toUpperCase())<0?ac.manufacturer.split(' ')[0]+' ':'')+ac.type);
    return a.t||'';
  }
  var HELI=/^(R22|R44|R66|EC2|EC3|EC4|EC5|EC6|H1|H2|H6|AS3|AS5|AS6|A109|A119|A139|A169|AW|B06|B407|B412|B429|BK17|S76|S92|MD5|MD6|NH90|LYNX|CH47|UH|AH64|G2CA|CABR)/;
  function kindOf(a,ac){
    var d=(a.desc||'')+' '+((ac&&ac.type)||''), t=a.t||'', cat=a.category||'';
    if(cat==='A7'||HELI.test(t)||/helicopter|copter|robinson|eurocopter/i.test(d)) return 'Helicopter';
    if(cat==='B2'||/balloon/i.test(d)) return 'Balloon';
    if(cat==='B1'||/glider|segelflug|\bASK|DG-|LS[0-9]|discus|duo|ventus|arcus/i.test(d)) return 'Glider';
    if(cat==='B4'||/ultralight|ultra-light|microlight/i.test(d)||/^PH-[0-9]/.test(a.r||'')) return 'Microlight';
    if(/citation|phenom|falcon|gulfstream|learjet|challenger|global|hawker|legacy|praetor|hondajet|premier|eclipse|vision jet|pilatus pc-24/i.test(d)) return 'Business jet';
    if(cat==='A2') return 'Business aircraft';
    return 'Light aircraft';
  }
  function ownerOK(o){ return !!o && /\b(b\.?v\.?|n\.?v\.?|club|vliegclub|aero|air|aviation|avia|flight|flying|school|academy|stichting|ltd|llc|limited|gmbh|inc|corp|s\.?a\.?|charter|jet|heli|police|politie|defen|ministry|ministerie|kustwacht|anwb|lifeliner|lease|leasing|bank|trust)\b/i.test(o) }

  // light-aircraft airfields used to explain where a flight comes from or is going
  var AIRFIELDS=[['Schiphol',52.3086,4.7639],['Rotterdam',51.9569,4.4372],['Lelystad',52.4603,5.5272],['Hilversum',52.1919,5.1469],['Midden-Zeeland',51.5122,3.7311],
    ['Seppe',51.5547,4.5525],['Teuge',52.2447,6.0464],['Texel',53.1153,4.8336],['De Kooy',52.9234,4.7806],['Middenmeer',52.8146,5.0794],['Eindhoven',51.4501,5.3745],
    ['Gilze-Rijen',51.5674,4.9318],['Woensdrecht',51.4491,4.342],['Drachten',53.1192,6.1297],['Hoogeveen',52.7308,6.5161],['Groningen',53.1197,6.5794],['Ameland',53.4517,5.6772],
    ['Antwerp',51.1894,4.4603],['Volkel',51.6564,5.7077]];
  var hist={};
  function trackHist(list){
    var now=Date.now(), seen={};
    list.forEach(function(a){ var h=hist[a.hex]||(hist[a.hex]={first:{t:now,lat:a.lat,lon:a.lon,alt:a.alt_baro},p:[]});
      var last=h.p[h.p.length-1]; if(!last||now-last.t>4000) h.p.push({t:now,lat:a.lat,lon:a.lon,alt:a.alt_baro,trk:a.track});
      while(h.p.length&&now-h.p[0].t>10*60e3) h.p.shift(); seen[a.hex]=1 });
    for(var k in hist) if(!seen[k] && now-(hist[k].p.length?hist[k].p[hist[k].p.length-1].t:0)>5*60e3) delete hist[k];
  }
  function nearestTown(lat,lon){
    var p=xy(lat,lon), best=null, bd=1e9, M=window.FF_MAP;
    if(Math.sqrt(p.x*p.x+p.y*p.y)<2.5) return CFG.name;
    ((M&&M.labels)||[]).forEach(function(t){ if(t[3]===2) return; var d=Math.hypot(t[1]-p.x,t[2]-p.y); if(d<bd){bd=d;best=t[0]} });
    return bd<8?best:'';
  }
  function nearestField(lat,lon){ var b=null,bd=1e9; AIRFIELDS.forEach(function(f){ var d=hav(lat,lon,f[1],f[2]); if(d<bd){bd=d;b=f} }); return b?{n:b[0],d:bd,lat:b[1],lon:b[2]}:null }
  function activity(a){
    var h=hist[a.hex], alt=typeof a.alt_baro==='number'?a.alt_baro:3000, vr=a.baro_rate||a.geom_rate||0, town=nearestTown(a.lat,a.lon);
    var pts=h?h.p:[], turn=0, span=pts.length?Date.now()-pts[0].t:0;
    for(var i=1;i<pts.length;i++) if(pts[i].trk!=null&&pts[i-1].trk!=null){ var d=pts[i].trk-pts[i-1].trk; if(d>180)d-=360; if(d<-180)d+=360; turn+=d }
    var net=pts.length>1?hav(pts[0].lat,pts[0].lon,a.lat,a.lon):99, path=0;
    for(var j=1;j<pts.length;j++) path+=hav(pts[j-1].lat,pts[j-1].lon,pts[j].lat,pts[j].lon);
    // 1. circling or flying back and forth over one area
    if(span>150e3 && (Math.abs(turn)>300 || (net<3 && path>5))){
      var slow=alt<1500 && nearestField(a.lat,a.lon).d<4;
      return {short:'circling', act:slow?'Flying circuits at '+nearestField(a.lat,a.lon).n:'Circling'+(town?(town===CFG.name?' over ':' near ')+town:''),
        why:slow?'Practising take-offs and landings':(a.category==='A7'||kindOf(a)==='Helicopter'?'Helicopter on a local mission':'Likely a training or sightseeing flight')};
    }
    // 2. just took off: first seen low and climbing close to an airfield
    if(h && h.first){ var ff=nearestField(h.first.lat,h.first.lon);
      if(ff && ff.d<6 && typeof h.first.alt==='number' && h.first.alt<1800 && vr>150) return {short:'from '+ff.n, act:'Departed from '+ff.n, why:'Climbing out'} }
    var nf=nearestField(a.lat,a.lon);
    if(nf && nf.d<8 && alt<1800 && vr>200) return {short:'from '+nf.n, act:'Departed from '+nf.n, why:'Climbing out'};
    // 3. heading for an airfield (descending, or the track points straight at one)
    if(a.track!=null){
      var tgt=null, td=1e9;

  // ---- aeronautical-chart backdrop behind the radar (compass rose, lat/lon grid, airways) ----
  function renderChart(){
    if(CFG.showChart===false) return;
    var wrap=$('radarWrap'), rad=$('radar'), ch=$('chart');
    var wr=wrap.getBoundingClientRect(), rr=rad.getBoundingClientRect();
    if(!rr.width) return;
    // radar SVG: 220 units across its box; use the same units for the backdrop, centred on the radar
    var mode=document.documentElement.className, rot=/\bR\b|R2/.test(mode);
    var W=rot?wr.height:wr.width, H=rot?wr.width:wr.height, S=rot?rr.height:rr.width;
    var k=220/S, cx=((rot?(rr.top-wr.top):(rr.left-wr.left))+S/2)*k, cy=((rot?(wr.right-rr.right):(rr.top-wr.top))+S/2)*k;
    if(/R2/.test(mode)) cy=((rr.left-wr.left)+S/2)*k;
    var vx=-cx, vy=-cy, vw=W*k, vh=H*k;
    ch.setAttribute('viewBox',vx+' '+vy+' '+vw+' '+vh);
    var col=TH[4], h='', kmU=100/RADAR_KM;
    // lat/lon grid every 0.1 deg (6'), labelled at the edges
    var dLat=0.1, dLon=0.1, latKm=111.32, lonKm=111.32*Math.cos(HOME.lat*Math.PI/180);
    function fmt(v,ns){ var a=Math.abs(v), d=Math.floor(a), m=Math.round((a-d)*60); if(m===60){d++;m=0} return d+'\u00b0'+(m<10?'0':'')+m+'\u2032'+(ns?(v>=0?'N':'S'):(v>=0?'E':'W')) }
    for(var la=Math.floor((HOME.lat-1)/dLat)*dLat; la<HOME.lat+1; la+=dLat){
      var y=-(la-HOME.lat)*latKm*kmU; if(y<vy||y>vy+vh) continue;
      h+='<line x1="'+vx+'" y1="'+y.toFixed(1)+'" x2="'+(vx+vw)+'" y2="'+y.toFixed(1)+'" stroke="'+col+'" stroke-width=".35" stroke-dasharray="1 3" opacity=".5"/>';
      h+='<text x="'+(vx+3)+'" y="'+(y-1.5).toFixed(1)+'" fill="'+col+'" font-size="4" opacity=".8">'+fmt(la,1)+'</text>';
    }
    for(var lo=Math.floor((HOME.lon-2)/dLon)*dLon; lo<HOME.lon+2; lo+=dLon){
      var x=(lo-HOME.lon)*lonKm*kmU; if(x<vx||x>vx+vw) continue;
      h+='<line x1="'+x.toFixed(1)+'" y1="'+vy+'" x2="'+x.toFixed(1)+'" y2="'+(vy+vh)+'" stroke="'+col+'" stroke-width=".35" stroke-dasharray="1 3" opacity=".5"/>';
      h+='<text x="'+(x+1.5).toFixed(1)+'" y="'+(vy+vh-3)+'" fill="'+col+'" font-size="4" opacity=".8">'+fmt(lo,0)+'</text>';
    }
    // airways: straight routes passing near, with waypoint triangles
    var AW=[[-25,-1.2],[62,0.55],[118,-0.35],[160,0.9],[32,-1.45]];   // [bearing deg, offset in radar radii]
    AW.forEach(function(a,i){
      var b=a[0]*Math.PI/180, dx=Math.sin(b), dy=-Math.cos(b), ox=-dy*a[1]*100, oy=dx*a[1]*100, L=900;
      h+='<line x1="'+(ox-dx*L).toFixed(1)+'" y1="'+(oy-dy*L).toFixed(1)+'" x2="'+(ox+dx*L).toFixed(1)+'" y2="'+(oy+dy*L).toFixed(1)+'" stroke="'+col+'" stroke-width=".5" opacity=".55"/>';
      for(var t=-3;t<=3;t++){ var px=ox+dx*(t*70+i*13), py=oy+dy*(t*70+i*13);
        h+='<path d="M'+px.toFixed(1)+' '+(py-2.6).toFixed(1)+' l2.3 4 h-4.6z" fill="none" stroke="'+col+'" stroke-width=".5" opacity=".75"/>'; }
    });
    // radio beacon (VOR) symbol at Schiphol, with its own small compass rose
    var sx=(4.7639-HOME.lon)*lonKm*kmU, sy=-(52.3086-HOME.lat)*latKm*kmU, hx='';
    for(var j=0;j<6;j++){ var an=j*Math.PI/3; hx+=(j?' L':'M')+(sx+4*Math.cos(an)).toFixed(1)+' '+(sy+4*Math.sin(an)).toFixed(1) }
    h+='<path d="'+hx+'Z" fill="none" stroke="'+col+'" stroke-width=".6" opacity=".8"/><circle cx="'+sx.toFixed(1)+'" cy="'+sy.toFixed(1)+'" r="22" fill="none" stroke="'+col+'" stroke-width=".4" opacity=".45"/>';
    for(var d=0;d<360;d+=10){ var ra=d*Math.PI/180, r1=d%30?20:18; h+='<line x1="'+(sx+r1*Math.sin(ra)).toFixed(1)+'" y1="'+(sy-r1*Math.cos(ra)).toFixed(1)+'" x2="'+(sx+22*Math.sin(ra)).toFixed(1)+'" y2="'+(sy-22*Math.cos(ra)).toFixed(1)+'" stroke="'+col+'" stroke-width=".4" opacity=".55"/>' }

      h+='<line x1="'+(r0*Math.sin(rg)).toFixed(2)+'" y1="'+(-r0*Math.cos(rg)).toFixed(2)+'" x2="'+(111*Math.sin(rg)).toFixed(2)+'" y2="'+(-111*Math.cos(rg)).toFixed(2)+'" stroke="'+col+'" stroke-width="'+(g%30===0?.7:.4)+'" opacity=".75"/>';
      if(g%30===0&&g){ var lab={90:'E',180:'S',270:'W'}[g]||String(g/10); h+='<text x="'+(118*Math.sin(rg)).toFixed(1)+'" y="'+(-118*Math.cos(rg)+1.6).toFixed(1)+'" fill="'+col+'" font-size="4.6" text-anchor="middle" opacity=".9">'+lab+'</text>' } }

  window.__rc=renderChart; if(CFG.showChart!==false) setTimeout(renderChart,300); window.addEventListener('resize',function(){ setTimeout(renderChart,100) });
  // ===================== tracking one flight anywhere in the world (started from the phone app) =====================

  var SEAS=[['North Sea',56,3,450],['Norwegian Sea',68,2,600],['Irish Sea',53.8,-5,150],['English Channel',50.2,-1.5,170],['Bay of Biscay',45,-4,300],['Mediterranean Sea',37,18,1100],
    ['Black Sea',43.3,34,450],['Baltic Sea',58,19,450],['Labrador Sea',58,-55,500],['Davis Strait',66.5,-58,330],['Baffin Bay',73,-66,450],['Hudson Bay',60,-85,600],
    ['Gulf of Mexico',25,-90,700],['Caribbean Sea',15,-75,900],['Red Sea',20,38.5,600],['Persian Gulf',26.5,52,350],['Arabian Sea',15,63,900],['Bay of Bengal',15,88,800],
    ['South China Sea',13,114,900],['East China Sea',29,126,500],['Sea of Japan',40,135,500],['Tasman Sea',-38,160,900],['Coral Sea',-18,155,800],['Gulf of Alaska',57,-145,600],
    ['Bering Sea',58,-178,800],['Greenland Sea',76,-5,500],['Barents Sea',74,40,600],['Caspian Sea',42,51,400],['Gulf of Guinea',2,3,700],['Mozambique Channel',-18,41,450],['Sea of Okhotsk',53,150,700]];

  function tFmtTime(ms,tz){ try{ return new Intl.DateTimeFormat('en-GB',{timeZone:tz||undefined,hour:'2-digit',minute:'2-digit',hour12:false}).format(new Date(ms)).split(':') }catch(e){ var d=new Date(ms); return [d.getHours(),pad(d.getMinutes())] } }

  function tPoll(){

  function tOpenSky(){

  }
  function tGot(a){

  // where the plane is now: the live position, or carried forward along the route when there is no coverage (oceans)

  function tBase(W,H,me){
    var g=window.d3, Wd=window.FF_WORLD; if(!g||!Wd) return;

      '<path d="'+path(g.geoGraticule().step([10,10])())+'" fill="none" stroke="'+TH[2]+'" stroke-width="1"/>'+
      '<path d="'+path(Wd.land)+'" fill="'+TH[2]+'" stroke="'+TH[5]+'" stroke-opacity=".6" stroke-width="1.2"/>'+
      '<path d="'+path(Wd.borders)+'" fill="none" stroke="'+TH[5]+'" stroke-opacity=".35" stroke-width=".8"/>';

  }
  function tMapDraw(me){
    var box=$('tMap'), W=box.clientWidth, H=box.clientHeight; if(!W||!H||!window.d3||!window.FF_WORLD) return;
    $('tSvg').setAttribute('viewBox','0 0 '+W+' '+H);

        h+='<g transform="translate('+pp[0].toFixed(1)+','+pp[1].toFixed(1)+') rotate('+ang.toFixed(1)+') scale(4.2)"><path d="'+planePath()+'" fill="'+ACC+'" stroke="'+TH[0]+'" stroke-width=".5"'+(me.est?' fill-opacity=".7"':'')+'/></g>';

  function tRender(){

    $('tRt').innerHTML=(o||d)?side(o,'')+side(d,'r'):'';
    var eta='', prog='';
    if(o&&d&&me&&T.phase!=='wait'){
      var fl=hav(o.latitude,o.longitude,me.lat,me.lon), lf=T.phase==='landed'?0:hav(me.lat,me.lon,d.latitude,d.longitude), pc=Math.max(0,Math.min(1,fl/Math.max(1,fl+lf)));

      if(T.phase==='landed'){ eta='<div class="k">Landed</div><div class="v">'+tClockAt(T.landedAt,T.tz)+'</div><div class="s">local time · '+tClockAt(T.landedAt,CFG.tz)+' here</div>' }
      else { var sp=(T.pos.gs&&T.pos.gs>150?T.pos.gs*1.852:820), mins=lf/sp*60+(lf>150?12:4), at=now+mins*60e3;
        eta='<div class="k">Lands in about</div><div class="v">'+tDur(mins)+'</div><div class="s">≈ '+(T.tz?tClockAt(at,T.tz)+' in '+esc(aptCity(d))+' · ':'')+tClockAt(at,CFG.tz)+' here</div>' }
    } else if(T.phase==='wait'){ eta='<div class="k">Status</div><div class="v">Not airborne yet</div><div class="s">Tracking starts at take-off</div>' }

      sx+='<div><div class="k">Speed</div><div class="v">'+(T.pos.gs!=null?fmt(T.pos.gs*U.sk)+' '+U.s:'–')+'</div><div class="s">'+(T.pos.gs!=null?(U.s==='kt'?fmt(T.pos.gs*1.852)+' km/h':fmt(T.pos.gs)+' kt'):'')+(T.pos.trk!=null?' · heading '+compass(T.pos.trk):'')+'</div></div>' }

    $('trk').classList.add('on'); tRender();
    loadScript('d3-array.min.js').then(function(){ return loadScript('d3-geo.min.js') }).then(function(){ return loadScript('world.js') }).then(function(){ T.base=''; tRender() }).catch(function(){});

})();
