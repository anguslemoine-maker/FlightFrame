<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Overhead</title>
<style>
  :root{
    --bg:#07090d; --panel:#10141b; --line:#1d2430; --text:#eef2f7; --dim:#7d8898; --faint:#4a5566;
    --amber:#ffb238; --cyan:#4fd1ff; --green:#5be38a; --red:#ff6b6b;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:var(--bg);color:var(--text);overflow:hidden;
    font-family:"sans-serif-condensed","Roboto Condensed",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
  #root{position:absolute;left:0;top:0;width:100%;height:100%;display:flex;flex-direction:column;padding:34px 40px 30px}
  /* page drawn sideways for a frame whose firmware is stuck in portrait */
  .R #root{width:100vh;height:100vw;transform-origin:0 0;transform:rotate(-90deg) translateX(-100%)}
  .R2 #root{width:100vh;height:100vw;transform-origin:0 0;transform:rotate(90deg) translateY(-100%)}
  .R3 #root{transform:rotate(180deg)}
  .mono{font-family:"Roboto Mono","Droid Sans Mono",monospace}

  /* header */
  #hdr{display:flex;justify-content:space-between;align-items:flex-end;padding-bottom:20px;border-bottom:1px solid var(--line)}
  #hdr .place{font-size:20px;letter-spacing:5px;color:var(--dim);text-transform:uppercase}
  #hdr .place b{color:var(--amber);font-weight:700}
  #clock{font-size:44px;font-weight:300;letter-spacing:1px}
  #status{font-size:15px;color:var(--faint);margin-top:6px;letter-spacing:2px;text-transform:uppercase}

  /* hero */
  #hero{padding:26px 0 22px;border-bottom:1px solid var(--line);min-height:860px;position:relative}
  .airline{display:flex;align-items:center;min-height:64px}
  .logo{height:64px;background:#fff;border-radius:12px;padding:8px 14px;margin-right:20px;display:none}
  .logo img{height:48px;display:block}
  .aname{font-size:30px;color:var(--dim);letter-spacing:1px}
  .fno{font-size:96px;font-weight:700;line-height:1;margin-top:14px;letter-spacing:-2px}
  .fno small{font-size:24px;color:var(--faint);font-weight:400;letter-spacing:2px;margin-left:14px;vertical-align:middle}

  #plane{height:230px;margin:10px -20px 0;}
  #plane svg{width:100%;height:100%;display:block}
  .route{display:grid;grid-template-columns:1fr 90px 1fr;align-items:center;margin-top:4px}
  .apt .code{font-size:84px;font-weight:700;line-height:1;color:var(--amber)}
  .apt .city{font-size:24px;color:var(--dim);margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .apt.to{text-align:right}
  .arrow{text-align:center;color:var(--faint)}
  .arrow svg{width:60px;height:60px}
  .prog{height:6px;background:var(--line);border-radius:3px;margin-top:22px;position:relative}
  .prog i{position:absolute;left:0;top:0;bottom:0;background:var(--amber);border-radius:3px}
  .noroute{font-size:30px;color:var(--faint);margin-top:34px}
  .rnote2{font-size:16px;color:var(--faint);margin-top:8px;letter-spacing:1px}

  .stats{display:grid;grid-template-columns:1fr 1fr;grid-gap:16px;margin-top:24px}
  .stat{background:var(--panel);border-radius:14px;padding:18px 22px}
  .stat .k{font-size:16px;letter-spacing:3px;color:var(--faint);text-transform:uppercase}
  .stat .v{font-size:44px;font-weight:700;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .stat .s{font-size:20px;color:var(--dim);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .up{color:var(--green)} .down{color:var(--cyan)}

  /* idle */
  #idle{display:none;position:absolute;left:0;right:0;top:0;bottom:0;align-items:center;justify-content:center;flex-direction:column;text-align:center}
  #idle{justify-content:flex-start;align-items:stretch;text-align:left;padding-top:26px}
  .iclock{font-size:150px;font-weight:300;line-height:1;letter-spacing:-2px}
  .idate{font-size:30px;color:var(--dim);margin-top:6px}
  .wx{display:flex;align-items:center;margin-top:34px}
  .wxicon{width:120px;height:120px;margin-right:26px;flex:0 0 120px}
  .wxicon svg{width:100%;height:100%}
  .wxtemp{font-size:76px;font-weight:700;line-height:1}
  .wxdesc{font-size:24px;color:var(--dim);margin-top:6px}
  .ihead{font-size:15px;letter-spacing:3px;color:var(--faint);text-transform:uppercase;margin-bottom:8px}
  .rain{margin-top:34px}
  #rainChart svg{width:100%;height:88px;display:block}
  .rnote{position:absolute;font-size:16px;color:var(--dim)}
  .facts{display:grid;grid-template-columns:1fr 1.4fr;grid-gap:16px;margin-top:30px}
  .fact{background:var(--panel);border-radius:14px;padding:18px 22px}
  .fv{font-size:28px;font-weight:700}
  .fs{font-size:19px;color:var(--dim);margin-top:4px}
  .quiet{margin-bottom:18px;font-size:24px;letter-spacing:3px;color:var(--dim);text-transform:uppercase}

  /* radar */
  #radarWrap{flex:1;display:flex;align-items:center;justify-content:center;padding:18px 0;min-height:0}
  #radar{height:100%;max-height:460px;width:auto}

  /* list */
  #list{border-top:1px solid var(--line);padding-top:14px}
  .row{display:grid;grid-template-columns:140px 1fr 112px 96px;align-items:center;padding:9px 0;font-size:22px;border-bottom:1px solid var(--line)}
  .row:last-child{border-bottom:0}
  .row .cs{font-weight:700}
  .row .rt{color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:10px}
  .row .al,.row .ds{text-align:right;color:var(--dim)}
  .row.sel .cs{color:var(--amber)}
  .lhead{font-size:15px;letter-spacing:3px;color:var(--faint);text-transform:uppercase;margin-bottom:4px}


  /* layout wrappers */
  #main{flex:1;display:flex;flex-direction:column;min-height:0}
  #side{flex:1;display:flex;flex-direction:column;min-height:0}

  /* ---------- landscape ---------- */
  .L #root{padding:24px 36px 22px}
  .L #hdr{padding-bottom:14px}
  .L #clock{font-size:38px}
  .L #main{flex-direction:row}
  .L #hero{flex:1;min-height:0;border-bottom:0;border-right:1px solid var(--line);padding:18px 36px 0 0}
  .L #side{flex:0 0 440px;padding-left:30px}
  .L #idle{padding-top:10px}
  .L .iclock{font-size:110px}
  .L .idate{font-size:24px}
  .L .wx{margin-top:18px}
  .L .wxicon{width:90px;height:90px;flex-basis:90px}
  .L .wxtemp{font-size:58px}
  .L .rain{margin-top:18px}
  .L #rainChart svg{height:64px}
  .L .facts{margin-top:16px}
  .L .quiet{margin-bottom:8px;font-size:20px}
  .L .airline{min-height:52px}
  .L .logo{height:52px;padding:6px 12px}
  .L .logo img{height:40px}
  .L .aname{font-size:26px}
  .L .fno{font-size:80px;margin-top:8px}
  .L #plane{height:250px;margin:0}
  .L .apt .code{font-size:64px}
  .L .apt .city{font-size:20px;margin-top:4px}
  .L .arrow svg{width:48px;height:48px}
  .L .prog{margin-top:14px}
  .L .noroute{margin-top:20px}
  .L .stats{grid-template-columns:1fr 1fr 1fr 1fr;grid-gap:12px;margin-top:18px}
  .L .stat{padding:12px 16px;border-radius:12px}
  .L .stat .k{font-size:13px;letter-spacing:2px}
  .L .stat .v{font-size:30px}
  .L .stat .s{font-size:16px}
  .L #radarWrap{padding:16px 0 10px}
  .L #radar{max-height:none;max-width:100%}
  .L .row{grid-template-columns:1fr 90px;font-size:19px;padding:8px 0}
  .L .row .cs{grid-row:1;grid-column:1}
  .L .row .ds{grid-row:1;grid-column:2}
  .L .row .al{display:none}
  .L .row .rt{grid-row:2;grid-column:1/3;font-size:17px;margin-top:2px}
  .L .lhead{font-size:13px}

  /* ---- boarding-pass ticket ---- */
  .ticket{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:26px 30px 24px;margin-top:6px;
          box-shadow:0 18px 40px -20px rgba(0,0,0,.55)}
  .ticket .route{margin-top:0}
  .ticket .arrow{display:none}
  .ticket .route{grid-template-columns:1fr 1fr}
  .arc{display:block;width:100%;height:64px;margin-top:6px}
  .perfrow{position:relative;margin:18px -30px 22px;height:28px}
  .perf{position:absolute;left:30px;right:30px;top:13px;border-top:2px dashed var(--line)}
  .notch{position:absolute;top:0;width:28px;height:28px;border-radius:50%;background:var(--bg);border:1px solid var(--line)}
  .notch.l{left:-15px;clip-path:inset(0 0 0 50%)} .notch.r{right:-15px;clip-path:inset(0 50% 0 0)}
  .ticket .stats{margin-top:0;grid-row-gap:22px}
  .ticket .stat{background:none;padding:0;border-radius:0}
  .ticket .stat .k{font-size:14px}
  .ticket .stat .v{font-size:40px}
  .barcode{height:38px;margin-top:24px;opacity:.55;border-radius:2px;
    background:repeating-linear-gradient(90deg,#7d8898 0 2px,transparent 2px 5px,#7d8898 5px 6px,transparent 6px 9px,#7d8898 9px 12px,transparent 12px 14px,#7d8898 14px 15px,transparent 15px 19px)}
  .ticket .rnote2{margin-top:2px}
  #plane{height:180px;margin-top:0}
  #hero{min-height:0}
  .ticket{padding:22px 28px 20px}
  .ticket .apt .code{font-size:76px}
  .arc{height:52px}
  .perfrow{margin:12px -28px 16px}
  .perf{left:28px;right:28px}
  .ticket .stats{grid-row-gap:16px}
  .ticket .stat .v{font-size:36px}
  .ticket .stat .s{font-size:18px}
  #radarWrap{min-height:250px}
  .L #plane{height:210px}
  .L .ticket .apt .code{font-size:56px}
  .L .ticket .stats{grid-template-columns:repeat(4,1fr)}
  .L .ticket .stat .v{font-size:26px}
  .L .ticket .stat .s{font-size:15px}
  .L .perfrow{margin:8px -28px 12px}

  #dim{position:fixed;left:0;top:0;right:0;bottom:0;background:#000;opacity:0;pointer-events:none}

  /* portrait: bigger map radar */
  #hero{padding:18px 0 14px}
  .fno{font-size:84px;margin-top:10px}
  #plane{height:140px}
  #radarWrap{padding:8px 0 6px;min-height:300px}
  #radar{max-height:none;max-width:100%}
  .row{padding:6px 0}
  .L #hero{padding:18px 36px 0 0}
  .L .fno{font-size:80px;margin-top:8px}
  .L #plane{height:210px}
  .L #radarWrap{padding:16px 0 10px}
  .L .row{padding:8px 0}

  .schline{font-size:19px;color:var(--dim);margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .schline .schtag{font-size:12px;letter-spacing:2px;color:#0b0f15;background:#7d8898;border-radius:4px;padding:2px 6px;margin-right:10px;vertical-align:2px;font-weight:700}
  .schline.late b{color:var(--amber)}
  .L .schline{font-size:16px}
</style>
</head>
<body>
<div id="root">
  <div id="hdr">
    <div>
      <div class="place">Overhead · <b id="placeName"></b></div>
      <div id="status">Connecting…</div>
    </div>
    <div id="clock" class="mono">--:--</div>
  </div>

  <div id="main">
  <div id="hero">
    <div id="card" class="fade">
      <div class="airline"><div class="logo" id="logo"><img id="logoImg" alt=""></div><div class="aname" id="aname"></div></div>
      <div class="fno" id="fno"></div>
      <div id="plane"></div>
      <div class="ticket">
      <div id="routeBox"></div>
      <div class="perfrow"><span class="notch l"></span><div class="perf"></div><span class="notch r"></span></div>
      <div class="stats">
        <div class="stat"><div class="k">Altitude</div><div class="v" id="alt"></div><div class="s" id="alt2"></div></div>
        <div class="stat"><div class="k">Speed</div><div class="v" id="spd"></div><div class="s" id="spd2"></div></div>
        <div class="stat"><div class="k">From you</div><div class="v" id="dst"></div><div class="s" id="dst2"></div></div>
        <div class="stat"><div class="k">Aircraft</div><div class="v" id="typ"></div><div class="s" id="reg"></div></div>
      </div>
      </div>
    </div>
    <div id="idle">
      <div class="quiet" id="quiet"></div>
      <div class="iclock" id="iClock">--:--</div>
      <div class="idate" id="iDate"></div>
      <div class="wx" id="wx"><div class="wxicon" id="wxIcon"></div><div><div class="wxtemp" id="wxTemp">–</div><div class="wxdesc" id="wxDesc">Loading weather…</div></div></div>
      <div class="rain"><div class="ihead">Rain · next 24 hours</div><div id="rainChart"></div></div>
      <div class="facts">
        <div class="fact"><div class="ihead">Sun</div><div class="fv" id="sunTxt">–</div></div>
        <div class="fact"><div class="ihead">Space station</div><div class="fv" id="issTxt">Calculating…</div><div class="fs" id="issSub"></div></div>
      </div>
    </div>
  </div>

  <div id="side">
    <div id="radarWrap"><svg id="radar" viewBox="-110 -110 220 220"></svg></div>
    <div id="list"><div class="lhead">Also nearby</div><div id="rows"></div></div>
  </div>
  </div>
  <script src="planes.js"></script>
  <script src="settings.js"></script>
  <script src="schiphol.js"></script>
  <script src="radarmap.js"></script>
  <script src="satellite.min.js"></script>
</div>
  <div id="dim"></div>

<script>
(function(){
  // ---- layout follows the frame's tilt sensor ----
  // The frame's firmware keeps the screen in portrait, so the page rotates itself.
  // Gravity in device axes: +y = landscape (sensor upright), -y = landscape flipped, +x = portrait, -x = portrait flipped.
  var MODES={P:'', P2:'R3', L:'L R', L2:'L R2'};
  var mode=null, cand=null, candSince=0;
  function applyMode(m){
    if(m===mode) return; mode=m;
    var real=window.innerWidth>window.innerHeight;
    document.documentElement.className = real ? 'L' : MODES[m];
    try{ localStorage.setItem('ff_mode',m) }catch(e){}
  }
  var FIXED=null; try{ var _s=window.FFApp&&FFApp.getSettings?JSON.parse(FFApp.getSettings()):(window.FF_SETTINGS||{}); if(_s.rotation&&_s.rotation!=='auto') FIXED=_s.rotation }catch(e){}
  try{ applyMode(FIXED||localStorage.getItem('ff_mode')||'L') }catch(e){ applyMode('L') }
  window.addEventListener('devicemotion',function(ev){ if(FIXED) return;
    var g=ev.accelerationIncludingGravity; if(!g||g.x==null) return;
    var x=g.x, y=g.y, m=null;
    if(Math.abs(y)>6 && Math.abs(y)>Math.abs(x)*1.5) m = y>0?'L':'L2';
    else if(Math.abs(x)>6 && Math.abs(x)>Math.abs(y)*1.5) m = x>0?'P':'P2';
    if(!m) return;
    var now=Date.now();
    if(m!==cand){ cand=m; candSince=now; return }
    if(now-candSince>1500) applyMode(m);    // must hold steady 1.5 s
  });
  // ---- settings ----
  // ---- settings: from the Flight Frame app (FFApp bridge), else settings.js, else defaults ----
  var DEF={name:'Leiderdorp',lat:52.1583,lon:4.5333,tz:'',radiusKm:18,radarRange:20,units:'metric',theme:'midnight',accent:'',
    rotation:'auto',showMap:true,showRadar:true,showList:true,listCount:4,showPlane:true,showWeather:true,showRain:true,showISS:true,mapCredit:true,
    clock24:true,nightDim:true,nightFrom:'23:00',nightTo:'07:00',nightLevel:65,minAltFt:0,maxAltFt:60000,featured:'nearest',cycleSec:20,
    pollSec:8,hideNoCallsign:false,schiphol:{id:'',secret:''}};
  var CFG={}; (function(){
    var s={}; try{ if(window.FFApp&&FFApp.getSettings) s=JSON.parse(FFApp.getSettings()); else if(window.FF_SETTINGS) s=window.FF_SETTINGS }catch(e){}
    for(var k in DEF) CFG[k]=(s&&s[k]!==undefined&&s[k]!==null&&s[k]!=='')?s[k]:DEF[k];
  })();
  if(CFG.schiphol&&CFG.schiphol.id) window.SCHIPHOL=CFG.schiphol;
  // themes: [bg, panel, line, text, dim, faint, accent, home/cyan, map filter]
  var THEMES={
    midnight:  ['#07090d','#10141b','#1d2430','#eef2f7','#7d8898','#4a5566','#ffb238','#4fd1ff',''],
    departures:['#000000','#0d0d0d','#262626','#ffd23f','#b39a3c','#6b5d2a','#ffd23f','#ffffff','grayscale(1) brightness(.8)'],
    daylight:  ['#eef1f5','#ffffff','#d5dbe3','#141a22','#5d6877','#8c96a3','#d9480f','#1c7ed6','invert(1) hue-rotate(180deg) brightness(1.15) contrast(.85)'],
    ocean:     ['#04121f','#0a1d30','#143049','#e6f1fb','#7f9bb5','#4c6680','#4fd1ff','#ffb238','hue-rotate(10deg) saturate(1.3)'],
    amber:     ['#0b0700','#140d02','#2b1d06','#ffb238','#b87d1f','#6e4b14','#ffcf70','#ffb238','sepia(1) saturate(2.2) hue-rotate(-12deg) brightness(.8)'],
    radar:     ['#020a04','#06140a','#0f2a16','#b6ffc8','#4fa266','#2f6a40','#5be38a','#b6ffc8','sepia(1) saturate(3) hue-rotate(75deg) brightness(.7)']};
  var TH=THEMES[CFG.theme]||THEMES.midnight, ACC=CFG.accent||TH[6];
  (function(){ var r=document.documentElement.style;
    ['--bg','--panel','--line','--text','--dim','--faint','--amber','--cyan'].forEach(function(v,i){ r.setProperty(v,i===6?ACC:TH[i]) }); })();
  // units
  var U={metric:{d:'km',dk:1,s:'km/h',sk:1.852,a:'m'},imperial:{d:'mi',dk:1.609344,s:'mph',sk:1.15078,a:'ft'},aviation:{d:'nm',dk:1.852,s:'kt',sk:1,a:'ft'}}[CFG.units]||{d:'km',dk:1,s:'km/h',sk:1.852,a:'m'};
  function dist(km,dp){ var v=km/U.dk; return (dp===0?Math.round(v):v.toFixed(dp==null?1:dp))+' '+U.d }
  function hhmm(s){ var p=String(s||'0:0').split(':'); return (parseInt(p[0],10)||0)*60+(parseInt(p[1],10)||0) }
  var HOME = {lat:+CFG.lat, lon:+CFG.lon};
  var RADIUS_NM = Math.max(1,Math.min(250,CFG.radiusKm/1.852));
  var RADAR_KM = CFG.radarRange*U.dk;
  var POLL_MS = Math.max(4,CFG.pollSec)*1000;

  var TYPES = {A19N:'Airbus A319neo',A20N:'Airbus A320neo',A21N:'Airbus A321neo',A318:'Airbus A318',A319:'Airbus A319',A320:'Airbus A320',A321:'Airbus A321',
    A332:'Airbus A330-200',A333:'Airbus A330-300',A338:'Airbus A330-800',A339:'Airbus A330-900',A343:'Airbus A340-300',A359:'Airbus A350-900',A35K:'Airbus A350-1000',A388:'Airbus A380',
    BCS1:'Airbus A220-100',BCS3:'Airbus A220-300',B737:'Boeing 737-700',B738:'Boeing 737-800',B739:'Boeing 737-900',B38M:'Boeing 737 MAX 8',B39M:'Boeing 737 MAX 9',B3XM:'Boeing 737 MAX 10',
    B744:'Boeing 747-400',B748:'Boeing 747-8',B752:'Boeing 757-200',B763:'Boeing 767-300',B772:'Boeing 777-200',B77W:'Boeing 777-300ER',B77L:'Boeing 777-200LR',B778:'Boeing 777-8',B779:'Boeing 777-9',
    B788:'Boeing 787-8',B789:'Boeing 787-9',B78X:'Boeing 787-10',E170:'Embraer 170',E175:'Embraer 175',E190:'Embraer 190',E195:'Embraer 195',E290:'Embraer E190-E2',E295:'Embraer E195-E2',
    AT72:'ATR 72',AT76:'ATR 72-600',AT75:'ATR 72-500',DH8D:'Dash 8 Q400',CRJ9:'CRJ-900',CRJ7:'CRJ-700',F70:'Fokker 70',F100:'Fokker 100',C172:'Cessna 172',PC12:'Pilatus PC-12',
    EC35:'Airbus H135',EC45:'Airbus H145',A139:'AW139',GLF6:'Gulfstream G650',C68A:'Citation Latitude',C25C:'Citation CJ4',C25B:'Citation CJ3',C25A:'Citation CJ2',C56X:'Citation Excel',C560:'Citation V',PC24:'Pilatus PC-24',SF50:'Cirrus Vision Jet',SR22:'Cirrus SR22',P28A:'Piper Cherokee',DA40:'Diamond DA40',DA42:'Diamond DA42',BE20:'King Air 200',B350:'King Air 350',FA7X:'Falcon 7X',F2TH:'Falcon 2000',GLEX:'Global Express',G280:'Gulfstream G280',LJ45:'Learjet 45',H25B:'Hawker 800',NH90:'NH90',H60:'Black Hawk',E55P:'Phenom 300',CL35:'Challenger 350',A400:'Airbus A400M',C130:'C-130 Hercules'};

  var routes = {};      // callsign -> {st:'p'|'ok'|'no', d:..., t:time}
  var featured = null;  // hex of featured aircraft
  var lastData = [];
  var $ = function(id){return document.getElementById(id)};

  // ---- helpers ----
  function pad(n){return (n<10?'0':'')+n}
  function fmt(n){return Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g,',')}
  function rad(d){return d*Math.PI/180}

  function sunEci(date){ // approximate sun direction (unit vector, ECI) and elevation helper

  }

  // ---- what kind of flight is it? (for non-airline traffic) ----
  var MIL_CS=/^(NAF|NCG|RRR|RFR|GAF|GAM|BAF|FAF|CTM|IAM|SPAR|RCH|NATO|NAVY|ASY|HKY|DUKE|PLF|SUI|HUAF|CEF|DNY|NOW|SVF|FNF|LAGR|BRK|KIWI|ASCOT|TARTN|MMF|RSF|SHF)/;
  function category(a,r,ac){
    var c=cs(a), own=((ac&&ac.registered_owner)||'')+' '+((r&&r.airline&&r.airline.name)||'');
    if(/coast ?guard|kustwacht|garde c[oô]ti|k[uü]stenwache/i.test(own) || /^NCG/.test(c)) return 'coastguard';
    if(/police|politie|polizei|gendarm/i.test(own) || /^(POLITIE|POL|PHPX)/.test(c)) return 'police';
    if(/ambulan|lifeliner|trauma|medical|air rescue|hems|rettung|ANWB|DRF|ADAC/i.test(own) || /^(LIFE|MMD|RESQ|AMB|CHX)/.test(c)) return 'medical';
    if(/navy|naval|marine|koninklijke marine|marineflieger/i.test(own)) return 'navy';
    if(/\barmy\b|landmacht|heer\b/i.test(own)) return 'army';
    if(/air force|luchtmacht|luftwaffe|force a[eé]rienne|\braf\b/i.test(own) || /^NAF/.test(c)) return 'airforce';
    if(/defen[cs]e|defensie|military|ministry of defence|NATO|bundeswehr/i.test(own) || (a.dbFlags&1) || MIL_CS.test(c)) return 'military';
    var airline = r&&r.airline&&r.airline.icao;
    var regLike = !c || (a.r && c.replace(/-/g,'')===a.r.replace(/-/g,'')) || !/^[A-Z]{3}\d/.test(c);
    if(!airline && regLike) return 'private';
    return '';
  }

  function renderPlane(a,r){
    if(!window.FFPlanes) return;
    var c=cs(a), al=r&&r.airline;
    var icao=al&&al.icao ? al.icao : (/^[A-Z]{3}\d/.test(c)?c.slice(0,3):'');
    var iataCode=(al&&al.iata)||FFPlanes.iata(icao);
    var iata=iataCode&&logoReady(iataCode) ? iataCode : '';
    var opts={}, ai=null, cat=category(a,r,craft[a.hex]&&craft[a.hex].st==='ok'?craft[a.hex].d:null);
    if(cat && cat!=='private'){ opts.cat=cat; iata=''; }
    else if(cat==='private' && !FFPlanes.known(icao)){ opts.cat=cat; }
    if(!opts.cat && icao && (!FFPlanes.known(icao) || !iataCode)){ ai=autoInfo(icao) }
    if(ai){
      if(!FFPlanes.known(icao) && ai.color) opts.tail=ai.color;
      if(!iata && ai.logo) opts.logoUrl=ICAO_LOGO+icao+'.png';
    }
    var key=a.hex+'|'+icao+'|'+iata+'|'+a.t+'|'+(opts.tail||'')+'|'+(opts.logoUrl?1:0)+'|'+(opts.cat||'');
    if(key===planeKey) return; planeKey=key;
    $('plane').innerHTML=FFPlanes.svg(a.t,icao,iata,a.r||'',opts);
  }

  function mapLayer(){
    var M=window.FF_MAP;
    if(!CFG.showMap||!M||hav(M.lat,M.lon,HOME.lat,HOME.lon)>1) return '';
    var k=100/RADAR_KM, half=M.halfKm*k;    // map image covers +/- halfKm around its centre
    var h='<defs><clipPath id="rclip"><circle r="100"/></clipPath><radialGradient id="rfade" r="50%"><stop offset="0.72" stop-color="'+TH[0]+'" stop-opacity="0"/><stop offset="1" stop-color="'+TH[0]+'" stop-opacity="0.8"/></radialGradient></defs>';
    h+='<g clip-path="url(#rclip)"><image href="radarmap.jpg" xlink:href="radarmap.jpg" x="'+(-half)+'" y="'+(-half)+'" width="'+(2*half)+'" height="'+(2*half)+'" opacity="0.95"'+(TH[8]?' style="filter:'+TH[8]+'"':'')+'/>';
    h+='<circle r="100" fill="url(#rfade)"/></g>';
    (M.labels||[]).forEach(function(t){ var x=t[1]*k, y=-t[2]*k; if(x*x+y*y>92*92) return; var fs=t[3]===1?8:(t[3]===2?7:6.2);
      h+='<text x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" text-anchor="middle" font-family="sans-serif" font-size="'+fs+'"'+(t[3]===1?' font-weight="600"':'')+(t[3]===2?' font-style="italic" letter-spacing="2"':'')+' fill="'+(t[3]===1?TH[3]:(t[3]===2?TH[7]:TH[4]))+'" fill-opacity="'+(t[3]===1?.8:.85)+'" stroke="'+TH[0]+'" stroke-width="1.6" paint-order="stroke" stroke-linejoin="round">'+esc(t[0])+'</text>'; });
    if(M.credit&&CFG.mapCredit!==false) h+='<text x="104" y="106" text-anchor="end" font-family="sans-serif" font-size="3.2" fill="'+TH[5]+'">'+esc(M.credit)+'</text>';
    return h;
  }
  function renderRadar(sel){
    var s=100/RADAR_KM, h=mapLayer();
    [1,2,3,4].forEach(function(q){ var k=CFG.radarRange*q/4, r=100*q/4; h+='<circle r="'+r+'" fill="none" stroke="'+TH[2]+'" stroke-width="0.6"/>'+
      '<text x="'+(r*0.707+1.5)+'" y="'+(-r*0.707-1.5)+'" fill="'+TH[5]+'" font-size="5.5">'+(Math.round(k*10)/10)+' '+U.d+'</text>'; });
    h+='<line x1="-104" y1="0" x2="104" y2="0" stroke="'+TH[2]+'" stroke-width="0.5" opacity=".6"/><line x1="0" y1="-104" x2="0" y2="104" stroke="'+TH[2]+'" stroke-width="0.5" opacity=".6"/>';
    h+='<text x="0" y="-104" text-anchor="middle" fill="'+TH[5]+'" font-size="6">N</text>';
    lastData.forEach(function(a){
      var p=xy(a.lat,a.lon); if(Math.sqrt(p.x*p.x+p.y*p.y)>RADAR_KM*1.08) return;
      var isSel=sel&&a.hex===sel.hex, col=isSel?ACC:TH[4], sc=isSel?1.25:0.85;
      h+='<g transform="translate('+(p.x*s).toFixed(1)+','+(-p.y*s).toFixed(1)+')">'+
         '<path d="'+planePath()+'" fill="'+col+'" transform="rotate('+(a.track||0)+') scale('+sc+')"/>'+
         '<text x="9" y="3" fill="'+col+'" font-size="'+(isSel?7:5.5)+'"'+(isSel?' font-weight="700"':'')+'>'+esc(cs(a)||a.r||'')+'</text></g>';
    });
    h+='<circle r="2.4" fill="'+TH[7]+'"/><circle r="5" fill="none" stroke="'+TH[7]+'" stroke-width="0.6" opacity="0.6"/>';
    $('radar').innerHTML=h;
  }

  function renderList(sel){
    var others=lastData.filter(function(a){return !sel||a.hex!==sel.hex}).slice(0,CFG.showList?Math.max(0,CFG.listCount):0), h='';
    others.forEach(function(a){
      var c=cs(a), r=schRoute(a,checkRoute(route(c),a));
      var rt = r&&r.origin&&r.destination ? (r.origin.iata_code+' '+aptCity(r.origin)+' → '+r.destination.iata_code+' '+aptCity(r.destination)) : (r&&r.destination ? '→ '+r.destination.iata_code+' '+aptCity(r.destination) : (r&&r.origin ? r.origin.iata_code+' '+aptCity(r.origin)+' →' : (TYPES[a.t]||a.t||'')));
      h+='<div class="row"><div class="cs mono">'+esc(c||a.r||'—')+'</div><div class="rt">'+esc(rt)+'</div><div class="al">'+(U.a==='m'?fmt(a.alt_baro*0.3048)+' m':fmt(a.alt_baro)+' ft')+'</div><div class="ds">'+dist(a.km)+'</div></div>';
    });
    $('list').style.visibility=others.length?'visible':'hidden';
    $('rows').innerHTML=h;
  }

  function render(){ var a=pickFeatured(); renderHero(a); if(CFG.showRadar) renderRadar(a); renderList(a); }
  function report(){
    if(!(window.FFApp&&FFApp.report)) return;
    try{ FFApp.report(JSON.stringify({t:Date.now(),count:lastData.length,featured:featured,
      flights:lastData.slice(0,12).map(function(a){ var c=cs(a), r=routes[c]&&routes[c].d; return {cs:c,reg:a.r||'',type:a.t||'',alt:a.alt_baro,km:Math.round(a.km*10)/10,
        from:r&&r.origin?r.origin.iata_code:'',to:r&&r.destination?r.destination.iata_code:''} })})) }catch(e){}
  }
  (function(){
    $('placeName').textContent=CFG.name;
    document.title='Overhead · '+CFG.name;
    $('quiet').textContent='No aircraft within '+dist(CFG.radiusKm,0)+' right now';
    if(!CFG.showRadar) $('radarWrap').style.display='none';
    if(!CFG.showPlane) $('plane').style.display='none';
    if(!CFG.showWeather) $('wx').style.display='none';
    if(!CFG.showRain) document.querySelector('.rain').style.display='none';
    if(!CFG.showISS) document.querySelectorAll('.fact')[1].style.display='none';
  })();
  setInterval(function(){ if(window.FFApp&&FFApp.heartbeat) FFApp.heartbeat() },20000);

  poll(); setInterval(poll,POLL_MS);
  // reload the page every 6 hours to keep things fresh
  setTimeout(function(){location.reload()},6*3600e3);
})();
</script>
</body>
</html>
